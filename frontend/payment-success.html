<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectricalVPF ERP | Plată reușită</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Dashboard & Shell CSS -->
    <link href="css/dashboard.css" rel="stylesheet">

    <!-- Payment Success CSS (scoped to this page) -->
    <link href="css/payment-success.css" rel="stylesheet">
</head>

<body data-page-title="Plată reușită">

    <div class="erp-wrapper">

        <!-- Dynamic Sidebar Container -->
        <div id="shellSidebar"></div>

        <!-- MAIN CONTENT AREA -->
        <main class="erp-main">

            <!-- Dynamic Topbar Container -->
            <div id="shellTopbar"></div>

            <!-- SUCCESS BODY CONTENT -->
            <div class="content-body">

                <div class="success-shell">

                    <!-- Confetti CSS-only, discret -->
                    <div class="confetti" aria-hidden="true">
                        <span class="confetti-piece"></span>
                        <span class="confetti-piece"></span>
                        <span class="confetti-piece"></span>
                        <span class="confetti-piece"></span>
                        <span class="confetti-piece"></span>
                        <span class="confetti-piece"></span>
                        <span class="confetti-piece"></span>
                        <span class="confetti-piece"></span>
                        <span class="confetti-piece"></span>
                        <span class="confetti-piece"></span>
                        <span class="confetti-piece"></span>
                        <span class="confetti-piece"></span>
                    </div>

                    <div class="success-icon">
                        <i class="fas fa-circle-check"></i>
                    </div>

                    <span class="success-plan-badge">
                        <i class="fas fa-bolt"></i>
                        Plan Pro activat
                    </span>

                    <h1 class="success-title">Felicitări! Ai trecut la planul Pro 🎉</h1>

                    <p class="success-desc">
                        Plata a fost procesată cu succes. Ai acum acces complet la toate funcțiile
                        ElectricalVPF ERP.
                    </p>

                    <div class="success-actions">
                        <button type="button" id="btnViewInvoice" class="success-btn success-btn-outline">
                            <i class="fas fa-file-invoice"></i>
                            <span id="btnViewInvoiceText">Vezi Factura</span>
                        </button>
                        <a href="dashboard.html" class="success-btn success-btn-solid">
                            <i class="fas fa-gauge-high"></i>
                            Mergi la Dashboard
                        </a>
                    </div>

                    <div class="alert alert-danger d-none success-error" id="invoiceError" role="alert"></div>

                </div>

            </div>

        </main>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Global ERP Utilities & Config -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>

    <!-- Shell JS (Global Auth & Layout Loader — include auth guard + apel /auth/me) -->
    <script src="js/shell.js"></script>

    <!-- Vezi Factura: preia session_id din URL (setat de Stripe la redirect), apelează
         GET /api/stripe/invoice/:sessionId, deschide factura într-un tab nou -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const params = new URLSearchParams(window.location.search);
            const sessionId = params.get("session_id");

            const btnInvoice = document.getElementById("btnViewInvoice");
            const btnInvoiceText = document.getElementById("btnViewInvoiceText");
            const errorEl = document.getElementById("invoiceError");
            if (!btnInvoice) return;

            if (!sessionId) {
                btnInvoice.disabled = true;
                btnInvoiceText.textContent = "Factura indisponibilă";
                return;
            }

            btnInvoice.addEventListener("click", async () => {
                errorEl.classList.add("d-none");
                errorEl.textContent = "";

                const originalText = btnInvoiceText.textContent;
                btnInvoice.disabled = true;
                btnInvoiceText.textContent = "Se încarcă...";

                try {
                    const response = await API.get(
                        `/stripe/invoice/${encodeURIComponent(sessionId)}`,
                    );

                    if (!response || !response.url) {
                        throw new Error("Factura nu este încă disponibilă.");
                    }

                    window.open(response.url, "_blank", "noopener");
                } catch (err) {
                    console.error("Eroare la preluarea facturii:", err);
                    errorEl.textContent =
                        (err && err.message) ||
                        "Nu s-a putut deschide factura. Încearcă din nou.";
                    errorEl.classList.remove("d-none");
                } finally {
                    btnInvoice.disabled = false;
                    btnInvoiceText.textContent = originalText;
                }
            });
        });
    </script>
</body>

</html>
