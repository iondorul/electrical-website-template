<!DOCTYPE html>
<html lang="ro">

<head>
    <script src="js/theme.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectricalVPF ERP | Dashboard</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Dashboard & Shell CSS -->
    <link href="css/dashboard.css" rel="stylesheet">
    <link href="css/dark-theme.css" rel="stylesheet">
</head>

<body data-page-title="Dashboard Overview" data-page-title-key="dashboard.pageTitle">

    <div class="erp-wrapper">

        <!-- Dynamic Sidebar Container -->
        <div id="shellSidebar"></div>

        <!-- MAIN CONTENT AREA -->
        <main class="erp-main">

            <!-- Dynamic Topbar Container -->
            <div id="shellTopbar"></div>

            <!-- DASHBOARD BODY CONTENT -->
            <div class="content-body">

                <!-- WELCOME BANNER -->
                <div class="welcome-card mb-4">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h2 class="fw-bold mb-1" id="welcomeTitle">👤 Welcome back!</h2>
                            <p class="text-muted mb-0" data-i18n="dashboard.subtitle">ElectricalVPF ERP System Overview for today.</p>
                        </div>
                        <span class="badge bg-success-subtle text-success px-3 py-2 rounded-pill fw-semibold">
                            <i class="fas fa-circle me-1 small"></i> <span data-i18n="dashboard.systemActive">System Active</span>
                        </span>
                    </div>
                </div>

                <!-- KPI METRICS GRID — carduri clickabile, navighează către modulul corespunzător.
                     Anchor-uri reale (<a href>), nu div+onclick, ca tab+Enter să funcționeze nativ,
                     fără cod JS suplimentar de accesibilitate. Valorile sunt încărcate din API-urile
                     reale existente (vezi dashboard.js) — skeleton-ul din markup e înlocuit la load. -->
                <div class="row g-3 mb-4" id="kpiRow">
                    <div class="col-12 col-sm-6 col-xl-2-4">
                        <a href="clients.html" class="kpi-card" data-kpi="clients">
                            <div class="kpi-icon bg-primary-subtle text-primary">
                                <i class="fas fa-users"></i>
                            </div>
                            <div class="kpi-data">
                                <span class="kpi-title" data-i18n="dashboard.kpi.clients">Clients</span>
                                <h3 class="kpi-value" id="kpiClientsValue"><span class="kpi-skeleton"></span></h3>
                            </div>
                        </a>
                    </div>

                    <div class="col-12 col-sm-6 col-xl-2-4">
                        <a href="projects.html" class="kpi-card" data-kpi="projects">
                            <div class="kpi-icon bg-info-subtle text-info">
                                <i class="fas fa-folder-open"></i>
                            </div>
                            <div class="kpi-data">
                                <span class="kpi-title" data-i18n="dashboard.kpi.projects">Projects</span>
                                <h3 class="kpi-value" id="kpiProjectsValue"><span class="kpi-skeleton"></span></h3>
                            </div>
                        </a>
                    </div>

                    <div class="col-12 col-sm-6 col-xl-2-4">
                        <a href="quotes.html" class="kpi-card" data-kpi="quotes">
                            <div class="kpi-icon bg-warning-subtle text-warning">
                                <i class="fas fa-file-signature"></i>
                            </div>
                            <div class="kpi-data">
                                <span class="kpi-title" data-i18n="dashboard.kpi.openQuotes">Open Quotes</span>
                                <h3 class="kpi-value" id="kpiQuotesValue"><span class="kpi-skeleton"></span></h3>
                            </div>
                        </a>
                    </div>

                    <div class="col-12 col-sm-6 col-xl-2-4">
                        <a href="invoices.html" class="kpi-card" data-kpi="invoices">
                            <div class="kpi-icon bg-purple-subtle text-purple">
                                <i class="fas fa-file-invoice"></i>
                            </div>
                            <div class="kpi-data">
                                <span class="kpi-title" data-i18n="dashboard.kpi.invoices">Invoices</span>
                                <h3 class="kpi-value" id="kpiInvoicesValue"><span class="kpi-skeleton"></span></h3>
                            </div>
                        </a>
                    </div>

                    <div class="col-12 col-sm-6 col-xl-2-4">
                        <a href="reports.html" class="kpi-card" data-kpi="revenue">
                            <div class="kpi-icon bg-success-subtle text-success">
                                <i class="fas fa-euro-sign"></i>
                            </div>
                            <div class="kpi-data">
                                <span class="kpi-title" data-i18n="dashboard.kpi.revenue">Revenue</span>
                                <h3 class="kpi-value" id="kpiRevenueValue"><span class="kpi-skeleton"></span></h3>
                            </div>
                        </a>
                    </div>
                </div>

                <!-- TABLES & RECENT ACTIVITY GRID -->
                <div class="row g-4">
                    <!-- Recent Projects -->
                    <div class="col-12 col-lg-7">
                        <div class="card content-card h-100">
                            <div class="card-header bg-transparent d-flex justify-content-between align-items-center">
                                <h5 class="card-title mb-0"><i class="fas fa-list-check me-2 text-primary dashboard-icon-trigger" id="recentProjectsIconTrigger"
                                        role="button" tabindex="0" data-i18n-title="dashboard.sortFilter.label" data-i18n-aria-label="dashboard.sortFilter.label"
                                        title="Sort &amp; filter" aria-label="Sort &amp; filter"></i><span data-i18n="dashboard.recentProjects">Recent
                                    Projects</span></h5>
                                <div class="d-flex align-items-center gap-2">
                                    <div class="dropdown">
                                        <button type="button" class="dashboard-toolbar-btn" id="recentProjectsToolsBtn"
                                            data-bs-toggle="dropdown" aria-expanded="false" data-bs-auto-close="outside"
                                            data-i18n-title="dashboard.sortFilter.label" data-i18n-aria-label="dashboard.sortFilter.label"
                                            title="Sort &amp; filter" aria-label="Sort &amp; filter">
                                            <i class="fas fa-arrow-down-wide-short"></i>
                                        </button>
                                        <div class="dropdown-menu dropdown-menu-end dashboard-tools-menu" id="recentProjectsToolsMenu" aria-labelledby="recentProjectsToolsBtn">
                                            <h6 class="dropdown-header" data-i18n="dashboard.sortFilter.sortBy">Sort by</h6>
                                            <button type="button" class="dropdown-item sort-option active" data-sort="recent">
                                                <span data-i18n="dashboard.sortFilter.recent">Most recent</span>
                                                <i class="fas fa-check sort-option-check"></i>
                                            </button>
                                            <button type="button" class="dropdown-item sort-option" data-sort="value">
                                                <span data-i18n="dashboard.sortFilter.value">Project value</span>
                                                <i class="fas fa-check sort-option-check"></i>
                                            </button>
                                            <button type="button" class="dropdown-item sort-option" data-sort="name">
                                                <span data-i18n="dashboard.sortFilter.name">Name</span>
                                                <i class="fas fa-check sort-option-check"></i>
                                            </button>
                                            <button type="button" class="dropdown-item sort-option" data-sort="status">
                                                <span data-i18n="dashboard.sortFilter.status">Status</span>
                                                <i class="fas fa-check sort-option-check"></i>
                                            </button>
                                            <div class="dropdown-divider"></div>
                                            <h6 class="dropdown-header" data-i18n="dashboard.sortFilter.filterByStatus">Filter by status</h6>
                                            <button type="button" class="dropdown-item filter-option active" data-status="all">
                                                <span data-i18n="dashboard.sortFilter.allStatuses">All statuses</span>
                                                <i class="fas fa-check filter-option-check"></i>
                                            </button>
                                            <button type="button" class="dropdown-item filter-option" data-status="draft">
                                                <span data-i18n="dashboard.status.draft">Draft</span>
                                                <i class="fas fa-check filter-option-check"></i>
                                            </button>
                                            <button type="button" class="dropdown-item filter-option" data-status="planned">
                                                <span data-i18n="dashboard.status.planned">Planned</span>
                                                <i class="fas fa-check filter-option-check"></i>
                                            </button>
                                            <button type="button" class="dropdown-item filter-option" data-status="in_progress">
                                                <span data-i18n="dashboard.status.inProgress">In Progress</span>
                                                <i class="fas fa-check filter-option-check"></i>
                                            </button>
                                            <button type="button" class="dropdown-item filter-option" data-status="on_hold">
                                                <span data-i18n="dashboard.status.onHold">On Hold</span>
                                                <i class="fas fa-check filter-option-check"></i>
                                            </button>
                                            <button type="button" class="dropdown-item filter-option" data-status="completed">
                                                <span data-i18n="dashboard.status.completed">Completed</span>
                                                <i class="fas fa-check filter-option-check"></i>
                                            </button>
                                            <button type="button" class="dropdown-item filter-option" data-status="cancelled">
                                                <span data-i18n="dashboard.status.cancelled">Cancelled</span>
                                                <i class="fas fa-check filter-option-check"></i>
                                            </button>
                                            <div class="dropdown-divider"></div>
                                            <button type="button" class="dropdown-item justify-content-start text-danger" id="recentProjectsResetBtn">
                                                <i class="fas fa-rotate-left me-2"></i><span data-i18n="dashboard.sortFilter.reset">Reset filters</span>
                                            </button>
                                        </div>
                                    </div>
                                    <a href="projects.html" class="btn btn-sm btn-outline-primary" data-i18n="dashboard.viewAll">View All</a>
                                </div>
                            </div>
                            <div class="card-body p-0">
                                <div class="table-responsive">
                                    <table class="table table-hover align-middle mb-0">
                                        <thead class="table-light">
                                            <tr>
                                                <th data-i18n="dashboard.table.projectName">Project Name</th>
                                                <th data-i18n="dashboard.table.client">Client</th>
                                                <th data-i18n="dashboard.table.status">Status</th>
                                                <th data-i18n="dashboard.table.value">Value</th>
                                            </tr>
                                        </thead>
                                        <tbody id="recentProjectsBody">
                                            <tr>
                                                <td colspan="4" class="text-center text-muted py-4"><span class="spinner-border spinner-border-sm"></span></td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Recent Activity Stream -->
                    <div class="col-12 col-lg-5">
                        <div class="card content-card h-100">
                            <div class="card-header bg-transparent d-flex justify-content-between align-items-center">
                                <h5 class="card-title mb-0"><i
                                        class="fas fa-clock-rotate-left me-2 text-primary dashboard-icon-trigger" id="activityIconTrigger"
                                        role="button" tabindex="0" data-i18n-title="dashboard.activity.refresh" data-i18n-aria-label="dashboard.activity.refresh"
                                        title="Refresh activity" aria-label="Refresh activity"></i><span data-i18n="dashboard.systemActivity">System Activity</span></h5>
                                <button type="button" class="dashboard-toolbar-btn" id="activityRefreshBtn"
                                    data-i18n-title="dashboard.activity.refresh" data-i18n-aria-label="dashboard.activity.refresh"
                                    title="Refresh activity" aria-label="Refresh activity">
                                    <i class="fas fa-arrows-rotate" id="activityRefreshIcon"></i>
                                </button>
                            </div>
                            <div class="card-body">
                                <ul class="activity-timeline list-unstyled mb-0" id="activityTimelineList">
                                    <li class="text-center text-muted py-4"><span class="spinner-border spinner-border-sm"></span></li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

        </main>

    </div>

    <!-- MODAL: Detalii Proiect (READ-ONLY, dublu-click pe un rând din Recent Projects) -->
    <div class="modal fade" id="dashboardProjectModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="dashboardProjectModalTitle">-</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="dashboardProjectModalBody"></div>
                <div class="modal-footer" id="dashboardProjectModalFooter"></div>
            </div>
        </div>
    </div>

    <!-- MODAL: Detalii Activitate (READ-ONLY, dublu-click pe un item din System Activity) -->
    <div class="modal fade" id="dashboardActivityModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="dashboardActivityModalTitle">-</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="dashboardActivityModalBody"></div>
                <div class="modal-footer" id="dashboardActivityModalFooter"></div>
            </div>
        </div>
    </div>

    <!-- TOAST CONTAINER -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="erpToast" class="toast align-items-center text-white bg-success border-0" role="alert"
            aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="toastMessage">Opțiune salvată cu succes!</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Global ERP Utilities & Config -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/api.js"></script>

    <!-- Shell JS (Global Auth & Layout Loader) -->
    <script src="js/i18n.js"></script>
    <script src="js/shell.js"></script>

    <!-- Dashboard Specific JS -->
    <script src="js/dashboard.js"></script>
</body>

</html>
