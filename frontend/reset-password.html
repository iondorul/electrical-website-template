<!DOCTYPE html>
<html lang="ro">

<head>
    <script src="js/theme.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectricalVPF ERP | Resetare Parolă</title>

    <link rel="icon" type="image/svg+xml" href="../img/favicon-light.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Login CSS (design identic cu login.html) -->
    <link href="css/login.css" rel="stylesheet">
</head>

<body>

    <div class="login-page">
        <div class="background-overlay"></div>

        <!-- Comutare temă + selector de limbă (pagină publică, fără sidebar/topbar ERP) -->
        <div class="auth-header-controls">
            <button type="button" class="auth-theme-toggle-btn" id="themeToggleBtn" data-i18n-title="header.toggleTheme"
                data-i18n-aria-label="header.toggleTheme" title="Comută tema" aria-label="Comută tema">
                <i class="fas fa-sun theme-toggle-icon icon-sun"></i>
                <i class="fas fa-moon theme-toggle-icon icon-moon"></i>
            </button>
            <div class="dropdown auth-lang-switcher">
                <button type="button" class="lang-switcher-btn" id="langSwitcherBtn" data-bs-toggle="dropdown"
                    aria-expanded="false" data-i18n-title="header.language" title="Limbă / Language"></button>
                <ul class="dropdown-menu lang-switcher-menu" id="langSwitcherMenu" aria-labelledby="langSwitcherBtn">
                </ul>
            </div>
        </div>

        <div class="container">
            <div class="row justify-content-center align-items-center min-vh-100">
                <div class="col-12 d-flex justify-content-center">

                    <div class="login-card">

                        <!-- Logo & Header -->
                        <div class="text-center mb-4">
                            <div class="logo-circle">
                                <i class="fas fa-bolt"></i>
                            </div>
                            <h1 class="brand-title">ElectricalVPF ERP</h1>
                            <p class="brand-subtitle" data-i18n="auth.resetPassword.subtitle">Setează o parolă nouă</p>
                        </div>

                        <div id="resetPasswordAlert"></div>

                        <!-- Stare: token lipsă / invalid / expirat -->
                        <div id="invalidTokenState" class="d-none text-center">
                            <i class="fas fa-triangle-exclamation text-danger" style="font-size: 2.5rem;"></i>
                            <p class="text-muted my-3" id="invalidTokenMessage"
                                data-i18n="auth.resetPassword.invalidTokenDefault">
                                The reset link is invalid or has expired.
                            </p>
                            <a href="forgot-password.html" class="btn btn-login d-inline-block px-4"
                                data-i18n="auth.resetPassword.requestNewLink">
                                Request a new link
                            </a>
                        </div>

                        <!-- Formular Reset Password -->
                        <form id="resetPasswordForm" novalidate>

                            <!-- Parolă nouă -->
                            <div class="mb-4">
                                <label for="newPassword" class="form-label"
                                    data-i18n="auth.resetPassword.newPasswordLabel">New password</label>
                                <div class="input-group has-validation">
                                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                    <input type="password" class="form-control" id="newPassword"
                                        placeholder="Minim 8 caractere"
                                        data-i18n-placeholder="auth.resetPassword.newPasswordPlaceholder"
                                        autocomplete="new-password">
                                    <button class="btn btn-outline-secondary toggle-btn" type="button"
                                        id="toggleNewPassword">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                    <div class="invalid-feedback" id="newPasswordFeedback"
                                        data-i18n="auth.resetPassword.newPasswordInvalid">
                                        Password must be at least 8 characters!
                                    </div>
                                </div>
                            </div>

                            <!-- Confirmă parola nouă -->
                            <div class="mb-4">
                                <label for="confirmNewPassword" class="form-label"
                                    data-i18n="auth.resetPassword.confirmPasswordLabel">Confirm new password</label>
                                <div class="input-group has-validation">
                                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                    <input type="password" class="form-control" id="confirmNewPassword"
                                        placeholder="Reintrodu parola"
                                        data-i18n-placeholder="auth.resetPassword.confirmPasswordPlaceholder"
                                        autocomplete="new-password">
                                    <button class="btn btn-outline-secondary toggle-btn" type="button"
                                        id="toggleConfirmNewPassword">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                    <div class="invalid-feedback" id="confirmNewPasswordFeedback"
                                        data-i18n="auth.common.passwordMismatch">
                                        Passwords do not match.
                                    </div>
                                </div>
                            </div>

                            <!-- Submit Button -->
                            <div class="d-grid mb-3">
                                <button type="submit" id="resetButton" class="btn btn-login" disabled>
                                    <span id="resetButtonText">
                                        <i class="fas fa-key me-2"></i><span data-i18n="auth.resetPassword.submit">Reset
                                            password</span>
                                    </span>
                                    <span id="resetSpinner" class="spinner-border spinner-border-sm d-none"
                                        role="status"></span>
                                </button>
                            </div>

                            <div class="text-center">
                                <a href="login.html" class="forgot-password">
                                    <i class="fas fa-arrow-left me-1"></i><span data-i18n="auth.common.backToLogin">Back
                                        to sign in</span>
                                </a>
                            </div>

                        </form>

                        <!-- Footer -->
                        <div class="login-footer">
                            <p class="mb-1" data-i18n="auth.common.footerCopyright">© 2026 ElectricalVPF ERP</p>
                            <small data-i18n="auth.common.footerPoweredBy">Powered by ElectricalVPF</small>
                        </div>

                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap, i18n & Reset Password JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/reset-password.js"></script>

</body>

</html>
