<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectricalVPF ERP | Resetare Parolă</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="../css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Login CSS (design identic cu login.html) -->
    <link href="css/login.css" rel="stylesheet">
</head>

<body>

    <div class="login-page">
        <div class="background-overlay"></div>

        <div class="container">
            <div class="row justify-content-center align-items-center min-vh-100">
                <div class="col-12 d-flex justify-content-center">

                    <div class="login-card">

                        <!-- Logo & Header -->
                        <div class="text-center mb-4">
                            <div class="logo-circle">
                                <i class="fas fa-bolt"></i>
                            </div>
                            <h1 class="brand-title">ElectricalVPF ERP</h1>
                            <p class="brand-subtitle">Setează o parolă nouă</p>
                        </div>

                        <div id="resetPasswordAlert"></div>

                        <!-- Stare: token lipsă / invalid / expirat -->
                        <div id="invalidTokenState" class="d-none text-center">
                            <i class="fas fa-triangle-exclamation text-danger" style="font-size: 2.5rem;"></i>
                            <p class="text-muted my-3" id="invalidTokenMessage">
                                Linkul de resetare este invalid sau a expirat.
                            </p>
                            <a href="forgot-password.html" class="btn btn-login d-inline-block px-4">
                                Solicită un link nou
                            </a>
                        </div>

                        <!-- Formular Reset Password -->
                        <form id="resetPasswordForm" novalidate>

                            <!-- Parolă nouă -->
                            <div class="mb-4">
                                <label for="newPassword" class="form-label">Parolă nouă</label>
                                <div class="input-group has-validation">
                                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                    <input type="password" class="form-control" id="newPassword"
                                        placeholder="Minim 8 caractere" autocomplete="new-password">
                                    <button class="btn btn-outline-secondary toggle-btn" type="button"
                                        id="toggleNewPassword">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                    <div class="invalid-feedback" id="newPasswordFeedback">
                                        Parola trebuie să aibă cel puțin 8 caractere.
                                    </div>
                                </div>
                            </div>

                            <!-- Confirmă parola nouă -->
                            <div class="mb-4">
                                <label for="confirmNewPassword" class="form-label">Confirmă parola nouă</label>
                                <div class="input-group has-validation">
                                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                    <input type="password" class="form-control" id="confirmNewPassword"
                                        placeholder="Reintrodu parola" autocomplete="new-password">
                                    <button class="btn btn-outline-secondary toggle-btn" type="button"
                                        id="toggleConfirmNewPassword">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                    <div class="invalid-feedback" id="confirmNewPasswordFeedback">
                                        Parolele nu coincid.
                                    </div>
                                </div>
                            </div>

                            <!-- Submit Button -->
                            <div class="d-grid mb-3">
                                <button type="submit" id="resetButton" class="btn btn-login" disabled>
                                    <span id="resetButtonText">
                                        <i class="fas fa-key me-2"></i>Resetează parola
                                    </span>
                                    <span id="resetSpinner" class="spinner-border spinner-border-sm d-none"
                                        role="status"></span>
                                </button>
                            </div>

                            <div class="text-center">
                                <a href="login.html" class="forgot-password">
                                    <i class="fas fa-arrow-left me-1"></i>Înapoi la autentificare
                                </a>
                            </div>

                        </form>

                        <!-- Footer -->
                        <div class="login-footer">
                            <p class="mb-1">© 2026 ElectricalVPF ERP</p>
                            <small>Powered by ElectricalVPF</small>
                        </div>

                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap & Reset Password JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/reset-password.js"></script>

</body>

</html>
