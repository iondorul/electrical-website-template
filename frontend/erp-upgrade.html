<!DOCTYPE html>

    <title>ElectricalVPF ERP | Upgrade la Pro</title>

    <link rel="icon" type="image/svg+xml" href="../img/favicon-light.png">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body data-page-title="Upgrade la Pro" data-page-title-key="upgrade.pageTitle">

    <div class="erp-wrapper">

        <!-- Dynamic Sidebar Container -->
        <div id="shellSidebar"></div>

        <!-- MAIN CONTENT AREA -->
        <main class="erp-main">

            <!-- Dynamic Topbar Container -->
            <div id="shellTopbar"></div>

            <!-- UPGRADE BODY CONTENT -->
            <div class="content-body">

                <div class="row justify-content-center">
                    <div class="col-lg-7">
                        <div class="erp-upgrade-shell text-center">

                            <div class="erp-upgrade-icon">
                                <i class="fas fa-rocket"></i>
                            </div>

                            <h1 class="erp-upgrade-title" data-i18n="upgrade.title">Upgrade la planul Pro</h1>

                            <p class="erp-upgrade-desc" data-i18n="upgrade.desc">
                                Trece la Pro în siguranță, prin Stripe — card bancar, factură automată și
                                acces instant la toate funcțiile ERP.
                            </p>

                            <!-- Plan ales (Lunar/Anual, din ?interval= setat de toggle-ul de pe erp-plans.html)
                                 + reasigurare clară că timpul deja plătit nu se pierde niciodată — vezi scriptul
                                 de mai jos. Ascuns până la primul calcul reușit (evită un "flash" cu date greșite). -->
                            <div class="erp-upgrade-plan-info d-none" id="upgradePlanInfo">
                                <div class="erp-upgrade-plan-row">
                                    <span data-i18n="upgrade.chosenPlan">Plan ales</span>
                                    <strong id="upgradePlanChosenLabel"></strong>
                                </div>
                                <p class="erp-upgrade-plan-note" id="upgradePlanNote"></p>
                            </div>

                            <!-- Checkout Stripe (subscription) — vezi backend/controllers/stripeController.js -->
                            <button type="button" id="btnStartCheckout" class="erp-plan-cta erp-plan-cta-solid"
                                style="cursor: pointer;">
                                <i class="fas fa-credit-card me-2" id="btnStartCheckoutIcon"></i>
                                <span id="btnStartCheckoutText" data-i18n="upgrade.continueToPayment">Continuă la
                                    plată</span>
                            </button>

                            <div class="alert alert-danger d-none mt-3 mb-0" id="checkoutError" role="alert"></div>

                            <!-- Planul curent al userului — încărcat independent, direct din evenimentul
                                 erp:user-loaded emis de js/shell.js pe această pagină (apel propriu la
                                 /api/auth/me, care include acum coloana "plan"). Nimic preluat din erp-plans.html. -->
                            <div class="erp-plans-status d-none mt-4" id="erpPlanStatus"></div>

                            <div class="mt-4">
                                <a href="erp-plans.html" class="erp-plan-cta erp-plan-cta-outline">
                                    <i class="fas fa-arrow-left me-2"></i><span data-i18n="upgrade.backToPlans">Înapoi
                                        la planuri</span>
                                </a>
                            </div>

                        </div>
                    </div>
                </div>

            </div>

        </main>

    </div>

    <!-- Modal "Reînnoiește acum" — identic cu #renewNowConfirmModal din
         erp-plans.html (duplicare deliberată, aceeași convenție ca
         addIntervalUTC/formatDateRo de mai jos — pagină fără modul JS
         partajat). Apare DOAR pentru cazul grace-period-upgrade (acces deja
         plătit) — vezi condiționarea pe isGracePeriodReactivation din
         scripturile de mai jos; cazul genuin Free (mode:'subscription',
         prima abonare) NU e atins, butonul rămâne exact ca azi. -->
    <div class="modal fade" id="renewNowConfirmModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">
                        <i class="fas fa-circle-info me-2" style="color: #ff6b00;"></i><span
                            data-i18n="plans.renewNowModal.title">Reînnoiește acum</span>
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="erp-renew-period-options">
                        <label class="erp-renew-period-row">
                            <input type="radio" class="erp-renew-period-input" name="renewPeriod" value="1m" checked>
                            <span class="erp-renew-period-card">
                                <span class="erp-renew-period-label" data-i18n="plans.renewNowModal.periods.1m">1
                                    lună</span>
                                <span class="erp-renew-period-price">€14.90</span>
                            </span>
                        </label>
                        <label class="erp-renew-period-row">
                            <input type="radio" class="erp-renew-period-input" name="renewPeriod" value="6m">
                            <span class="erp-renew-period-card">
                                <span class="erp-renew-period-label" data-i18n="plans.renewNowModal.periods.6m">6
                                    luni</span>
                                <span class="erp-renew-period-price">€80.46<span
                                        class="erp-renew-period-discount">-10%</span></span>
                            </span>
                        </label>
                        <label class="erp-renew-period-row">
                            <input type="radio" class="erp-renew-period-input" name="renewPeriod" value="1y">
                            <span class="erp-renew-period-card">
                                <span class="erp-renew-period-label" data-i18n="plans.renewNowModal.periods.1y">1
                                    an</span>
                                <span class="erp-renew-period-price">€143.04<span
                                        class="erp-renew-period-discount">-20%</span></span>
                            </span>
                        </label>
                        <label class="erp-renew-period-row">
                            <input type="radio" class="erp-renew-period-input" name="renewPeriod" value="3y">
                            <span class="erp-renew-period-card">
                                <span class="erp-renew-period-label" data-i18n="plans.renewNowModal.periods.3y">3
                                    ani</span>
                                <span class="erp-renew-period-price">€375.48<span
                                        class="erp-renew-period-discount">-30%</span></span>
                            </span>
                        </label>
                        <label class="erp-renew-period-row">
                            <input type="radio" class="erp-renew-period-input" name="renewPeriod" value="5y">
                            <span class="erp-renew-period-card">
                                <span class="erp-renew-period-label"><span data-i18n="plans.renewNowModal.periods.5y">5
                                        ani</span><span class="erp-renew-period-best-tag"
                                        data-i18n="plans.renewNowModal.bestTag">Cel mai avantajos</span></span>
                                <span class="erp-renew-period-price">€536.40<span
                                        class="erp-renew-period-discount">-40%</span></span>
                            </span>
                        </label>
                    </div>
                    <p class="mb-0 small text-muted mt-3" id="renewNowPeriodNote"></p>
                    <div class="alert alert-danger d-none small mt-3 mb-0" id="renewNowModalError" role="alert"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="erp-plan-cta erp-plan-cta-outline" data-bs-dismiss="modal"
                        data-i18n="plans.renewNowModal.cancel">Anulează</button>
                    <button type="button" class="erp-plan-cta erp-plan-cta-solid" id="btnConfirmRenewNow"
                        data-i18n="plans.renewNowModal.confirm">
                        Continuă la plată
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Global ERP Utilities & Config -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>

    <!-- Shell JS (Global Auth & Layout Loader — include auth guard + apel /auth/me) -->
    <script src="js/i18n.js"></script>
    <script src="js/shell.js"></script>

    <!-- Plan ales — afișează intervalul (Lunar/Anual) și explică exact ce se
         întâmplă cu banii/timpul deja plătit înainte ca userul să confirme.
         Intervalul afișat e ÎNTOTDEAUNA cel ales de user pe toggle-ul din
         erp-plans.html (?interval=month|year, citit din query string) —
         inclusiv în grace period, unde createCheckoutSession/handleWebhook
         acum onorează efectiv această alegere (schimbă și prețul
         abonamentului Stripe dacă diferă de cel curent, vezi
         stripeController.js). Două cazuri de text:
         1. Grace period (abonament Stripe încă activ, current_period_end
            deja plătit) — "Ai deja acces Pro plătit până la X. Această
            plată adaugă [interval ales] — noul acces se întinde până la
            X + interval ales."
         2. User genuin Free (fără abonament) — nu există "deja plătit";
            textul spune doar ce se adaugă și până când ține noul acces.
         Data nouă e calculată client-side (UTC-safe, ca addBillingInterval
         din backend) doar pentru afișaj — suma și data reale rămân mereu
         cele calculate de Stripe la finalizarea plății. -->
    <script>
        function addIntervalUTC(date, interval) {
            const result = new Date(date.getTime());
            if (interval === "year") {
                result.setUTCFullYear(result.getUTCFullYear() + 1);
            } else {
                result.setUTCMonth(result.getUTCMonth() + 1);
            }
            return result;
        }

        function formatDateRo(date) {
            return date.toLocaleDateString(getCurrentLocaleCode(), {
                day: "numeric",
                month: "long",
                year: "numeric",
            });
        }

        // Modal "Reînnoiește acum" (grace period): tabel oglindă identic cu
        // RENEWAL_PERIODS din backend/controllers/stripeController.js — doar
        // pentru afișaj, prețul REAL e mereu calculat de resolveRenewalPeriod()
        // pe server. addMonthsUTC e algoritmic identic cu ramura "month" din
        // addBillingInterval() al backend-ului (același Date UTC, aceeași
        // metodă nativă — comportament garantat identic, nu o aproximare).
        // Baza de pornire (gracePeriodCurrentEnd) vine din același
        // /stripe/subscription-status folosit mai jos pentru "Plan ales",
        // care deja aplică logica "efectivă" (max între extensia locală și
        // data brută Stripe) — aceeași bază ca și computeExtendedPeriodEnd()
        // din backend.
        const RENEWAL_PERIODS_DISPLAY = {
            "1m": { months: 1, labelKey: "plans.renewNowModal.periods.1m", label: "1 lună" },
            "6m": { months: 6, labelKey: "plans.renewNowModal.periods.6m", label: "6 luni" },
            "1y": { months: 12, labelKey: "plans.renewNowModal.periods.1y", label: "1 an" },
            "3y": { months: 36, labelKey: "plans.renewNowModal.periods.3y", label: "3 ani" },
            "5y": { months: 60, labelKey: "plans.renewNowModal.periods.5y", label: "5 ani" },
        };

        function addMonthsUTC(date, months) {
            const result = new Date(date.getTime());
            result.setUTCMonth(result.getUTCMonth() + months);
            return result;
        }

        function getSelectedRenewPeriod() {
            const checked = document.querySelector('input[name="renewPeriod"]:checked');
            return checked ? checked.value : "1m";
        }

        // Setate mai jos, în blocul care populează panoul "Plan ales" — folosite
        // atât de acel panou, cât și de modal (notă) și de scriptul de checkout
        // (ca să decidă dacă butonul deschide modalul sau merge direct la
        // Stripe, vezi ultimul <script> din fișier).
        let isGracePeriodReactivation = false;
        let gracePeriodCurrentEnd = null;

        function updateRenewNowPeriodNote() {
            const noteEl = document.getElementById("renewNowPeriodNote");
            if (!noteEl || !gracePeriodCurrentEnd) return;
            const period =
                RENEWAL_PERIODS_DISPLAY[getSelectedRenewPeriod()] || RENEWAL_PERIODS_DISPLAY["1m"];
            const newDate = formatDateRo(
                addMonthsUTC(new Date(gracePeriodCurrentEnd), period.months),
            );
            const current = formatDateRo(new Date(gracePeriodCurrentEnd));
            noteEl.textContent = t("upgrade.renewModalNote",
                `Ai deja acces Pro plătit până la ${current}. Se adaugă ${period.label} — noul acces se va întinde până la ${newDate}.`,
                { current, period: t(period.labelKey, period.label), newDate },
            );
        }

        const renewNowModalEl = document.getElementById("renewNowConfirmModal");
        if (renewNowModalEl) {
            renewNowModalEl.addEventListener("show.bs.modal", updateRenewNowPeriodNote);
        }
        document.addEventListener("change", (e) => {
            if (e.target && e.target.name === "renewPeriod") {
                updateRenewNowPeriodNote();
            }
        });

        async function renderChosenPlanInfo() {
            const infoEl = document.getElementById("upgradePlanInfo");
            const chosenLabelEl = document.getElementById("upgradePlanChosenLabel");
            const noteEl = document.getElementById("upgradePlanNote");
            if (!infoEl || !chosenLabelEl || !noteEl) return;

            const params = new URLSearchParams(window.location.search);
            const interval = params.get("interval") === "year" ? "year" : "month";

            try {
                const subResponse = await API.get("/stripe/subscription-status");
                const data = subResponse && subResponse.data;
                const hasExistingPeriod = Boolean(data && data.currentPeriodEnd);
                isGracePeriodReactivation = hasExistingPeriod;
                if (hasExistingPeriod) {
                    gracePeriodCurrentEnd = data.currentPeriodEnd;

                    // Butonul "Continuă la plată" devine declarativ (deschide
                    // modalul, ca switch-yearly/switch-monthly din erp-plans.html)
                    // — logica din scriptul de checkout de mai jos oprește
                    // early la vederea isGracePeriodReactivation și lasă
                    // Bootstrap să preia click-ul.
                    const checkoutBtn = document.getElementById("btnStartCheckout");
                    if (checkoutBtn) {
                        checkoutBtn.setAttribute("data-bs-toggle", "modal");
                        checkoutBtn.setAttribute("data-bs-target", "#renewNowConfirmModal");
                    }
                }

                const isYearly = interval === "year";
                const priceLabel = isYearly
                    ? `€143.04${t("plans.pro.periodYearly", "/an")}`
                    : `€14.90${t("plans.pro.period", "/lună")}`;
                const intervalLabel = isYearly
                    ? t("plans.pro.billingToggle.yearly", "Anual")
                    : t("plans.pro.billingToggle.monthly", "Lunar");
                const addedLabelKey = isYearly ? "plans.renewNowModal.periods.1y" : "plans.renewNowModal.periods.1m";
                const addedLabel = t(addedLabelKey, isYearly ? "1 an" : "1 lună");

                chosenLabelEl.textContent = `${intervalLabel} — ${priceLabel}`;

                const baseDate = hasExistingPeriod ? new Date(data.currentPeriodEnd) : new Date();
                const formattedNewDate = formatDateRo(addIntervalUTC(baseDate, interval));

                if (hasExistingPeriod) {
                    const formattedPaidUntil = formatDateRo(baseDate);
                    noteEl.innerHTML = t(
                        "upgrade.alreadyPaidNote",
                        `Ai deja acces Pro plătit până la <strong>${formattedPaidUntil}</strong>. Această plată adaugă <strong>${addedLabel}</strong> — noul acces se va întinde până la <strong>${formattedNewDate}</strong>.`,
                        {
                            paidUntil: `<strong>${formattedPaidUntil}</strong>`,
                            added: `<strong>${addedLabel}</strong>`,
                            newDate: `<strong>${formattedNewDate}</strong>`,
                        },
                    );
                } else {
                    noteEl.innerHTML = t(
                        "upgrade.freshAccessNote",
                        `La confirmare, se adaugă <strong>${addedLabel}</strong> de acces Pro, cu reînnoire la <strong>${formattedNewDate}</strong>.`,
                        {
                            added: `<strong>${addedLabel}</strong>`,
                            newDate: `<strong>${formattedNewDate}</strong>`,
                        },
                    );
                }

                infoEl.classList.remove("d-none");
            } catch (err) {
                console.error("Eroare la pregătirea previzualizării planului ales:", err);
            }
        }

        document.addEventListener("DOMContentLoaded", renderChosenPlanInfo);
        // Re-randare la schimbarea limbii — panoul e construit prin innerHTML,
        // deci nu păstrează niciun data-i18n; re-fetch-ul /stripe/subscription-status
        // e minor (identic cu pattern-ul erp:locale-changed din celelalte module).
        document.addEventListener("erp:locale-changed", renderChosenPlanInfo);
    </script>

    <!-- Plan status: folosește userul deja încărcat de shell.js (event erp:user-loaded), fără alt apel API -->
    <script>
        let lastLoadedUpgradeUser = null;

        function renderUpgradePlanStatus(user) {
            const statusEl = document.getElementById("erpPlanStatus");
            if (!statusEl || !user) return;

            const planLabel = user.plan === "pro" ? "Pro" : "Free";

            statusEl.classList.remove("d-none");
            statusEl.innerHTML = `
                ${t("plans.authenticatedAs", "Autentificat ca")} <strong>${user.full_name || user.email}</strong> —
                <span class="badge-current-plan"><i class="fas fa-circle-info"></i> ${t("plans.planLabel", "Plan")}: ${planLabel}</span>
            `;
        }

        document.addEventListener("erp:user-loaded", (e) => {
            if (!e.detail) return;
            lastLoadedUpgradeUser = e.detail;
            renderUpgradePlanStatus(lastLoadedUpgradeUser);
        });

        // Randat o singură dată prin innerHTML (fără data-i18n în DOM), deci nu
        // se retraduce singur — reutilizează userul cache-uit, fără apel API nou.
        document.addEventListener("erp:locale-changed", () => {
            if (lastLoadedUpgradeUser) renderUpgradePlanStatus(lastLoadedUpgradeUser);
        });
    </script>

    <!-- Checkout Stripe: pornește sesiunea de plată la click, redirecționează spre Stripe.
         Cazul genuin Free (mode:'subscription', prima abonare) rămâne exact ca
         azi — click direct, fără modal. Cazul grace period (acces deja plătit)
         e interceptat: butonul a primit data-bs-toggle="modal" dinamic mai sus
         (vezi isGracePeriodReactivation), deci Bootstrap deschide modalul în
         loc să declanșeze acest listener — guard-ul de mai jos previne dubla
         acțiune dacă listener-ul tot rulează (click-ul unui buton cu
         data-bs-toggle nu e prevenit automat de Bootstrap). Confirmarea reală
         pentru grace period se întâmplă din #btnConfirmRenewNow, în interiorul
         modalului — vezi handleConfirmRenewNow mai jos. -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const btn = document.getElementById("btnStartCheckout");
            const btnIcon = document.getElementById("btnStartCheckoutIcon");
            const btnText = document.getElementById("btnStartCheckoutText");
            const errorEl = document.getElementById("checkoutError");
            if (!btn) return;

            btn.addEventListener("click", async () => {
                if (isGracePeriodReactivation) return;

                errorEl.classList.add("d-none");
                errorEl.textContent = "";

                btn.disabled = true;
                btnIcon.classList.remove("fa-credit-card");
                btnIcon.classList.add("fa-spinner", "fa-spin");
                btnText.textContent = t("plans.preparingPayment", "Se pregătește plata...");

                try {
                    const params = new URLSearchParams(window.location.search);
                    const interval = params.get("interval") === "year" ? "year" : "month";

                    const response = await API.post(
                        "/stripe/create-checkout-session",
                        { interval },
                    );

                    if (!response || !response.url) {
                        throw new Error(
                            (response && response.error) ||
                            t("upgrade.errorInvalidResponse", "Răspuns invalid de la server (lipsește URL-ul de plată)."),
                        );
                    }

                    window.location.href = response.url;
                } catch (err) {
                    console.error("Eroare la inițierea plății Stripe:", err);
                    errorEl.textContent =
                        (err && err.message) ||
                        t("upgrade.errorGeneric", "Nu s-a putut iniția plata. Încearcă din nou sau contactează suportul.");
                    errorEl.classList.remove("d-none");

                    btn.disabled = false;
                    btnIcon.classList.remove("fa-spinner", "fa-spin");
                    btnIcon.classList.add("fa-credit-card");
                    btnText.textContent = t("upgrade.continueToPayment", "Continuă la plată");
                }
            });
        });
    </script>

    <!-- Confirmare din modalul "Reînnoiește acum" (grace period) — trimite
         atât interval-ul ales pe erp-plans.html (Lunar/Anual, schimbă prețul
         abonamentului de bază dacă diferă), cât și period-ul ales acum în
         modal (câte luni se extinde renewal_extension_period_end, vezi
         backend/controllers/stripeController.js). Cele două rămân complet
         independente pe server — vezi handleWebhook, ramura grace-period-upgrade. -->
    <script>
        async function handleConfirmRenewNow(btn) {
            const errorEl = document.getElementById("renewNowModalError");
            if (errorEl) {
                errorEl.classList.add("d-none");
                errorEl.textContent = "";
            }

            const originalText = btn.textContent;
            btn.disabled = true;
            btn.textContent = t("plans.preparingPayment", "Se pregătește plata...");

            try {
                const period = getSelectedRenewPeriod();
                const params = new URLSearchParams(window.location.search);
                const interval = params.get("interval") === "year" ? "year" : "month";

                const response = await API.post(
                    "/stripe/create-checkout-session",
                    { interval, period },
                );

                if (!response || !response.url) {
                    throw new Error(
                        (response && response.error) ||
                        t("upgrade.errorInvalidResponse", "Răspuns invalid de la server (lipsește URL-ul de plată)."),
                    );
                }

                window.location.href = response.url;
            } catch (err) {
                console.error("Eroare la inițierea plății Stripe (reînnoire):", err);
                btn.disabled = false;
                btn.textContent = originalText;
                if (errorEl) {
                    errorEl.textContent =
                        (err && err.message) ||
                        t("upgrade.errorGeneric", "Nu s-a putut iniția plata. Încearcă din nou sau contactează suportul.");
                    errorEl.classList.remove("d-none");
                }
            }
        }

        document.addEventListener("click", (e) => {
            const confirmRenewNowBtn = e.target.closest("#btnConfirmRenewNow");
            if (confirmRenewNowBtn) {
                handleConfirmRenewNow(confirmRenewNowBtn);
            }
        });
    </script>
</body>
