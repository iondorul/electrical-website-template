<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectricalVPF ERP | Upgrade la Pro</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Dashboard & Shell CSS -->
    <link href="css/dashboard.css" rel="stylesheet">

    <!-- Plans & Upgrade CSS (scoped to this page + erp-plans.html) -->
    <link href="css/erp-plans.css" rel="stylesheet">
</head>

<body data-page-title="Upgrade la Pro">

    <div class="erp-wrapper">

        <!-- Dynamic Sidebar Container -->
        <div id="shellSidebar"></div>

        <!-- MAIN CONTENT AREA -->
        <main class="erp-main">

            <!-- Dynamic Topbar Container -->
            <div id="shellTopbar"></div>

            <!-- UPGRADE BODY CONTENT -->
            <div class="content-body">

                <div class="row justify-content-center">
                    <div class="col-lg-7">
                        <div class="erp-upgrade-shell text-center">

                            <div class="erp-upgrade-icon">
                                <i class="fas fa-rocket"></i>
                            </div>

                            <h1 class="erp-upgrade-title">Upgrade la planul Pro</h1>

                            <p class="erp-upgrade-desc">
                                Flow-ul de plată este în pregătire. În curând vei putea trece la Pro direct din
                                această pagină — card bancar, factură automată și acces instant la toate funcțiile
                                ERP.
                            </p>

                            <!-- Checkout Stripe (subscription) — vezi backend/controllers/stripeController.js -->
                            <button type="button" id="btnStartCheckout" class="erp-plan-cta erp-plan-cta-solid"
                                style="cursor: pointer;">
                                <i class="fas fa-credit-card me-2" id="btnStartCheckoutIcon"></i>
                                <span id="btnStartCheckoutText">Continuă la plată</span>
                            </button>

                            <div class="alert alert-danger d-none mt-3 mb-0" id="checkoutError" role="alert"></div>

                            <!-- Planul curent al userului — încărcat independent, direct din evenimentul
                                 erp:user-loaded emis de js/shell.js pe această pagină (apel propriu la
                                 /api/auth/me, care include acum coloana "plan"). Nimic preluat din erp-plans.html. -->
                            <div class="erp-plans-status d-none mt-4" id="erpPlanStatus"></div>

                            <div class="mt-4">
                                <a href="erp-plans.html" class="erp-plan-cta erp-plan-cta-outline">
                                    <i class="fas fa-arrow-left me-2"></i>Înapoi la planuri
                                </a>
                            </div>

                        </div>
                    </div>
                </div>

            </div>

        </main>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Global ERP Utilities & Config -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>

    <!-- Shell JS (Global Auth & Layout Loader — include auth guard + apel /auth/me) -->
    <script src="js/shell.js"></script>

    <!-- Plan status: folosește userul deja încărcat de shell.js (event erp:user-loaded), fără alt apel API -->
    <script>
        document.addEventListener("erp:user-loaded", (e) => {
            const statusEl = document.getElementById("erpPlanStatus");
            if (!statusEl) return;
            const user = e.detail;
            if (!user) return;

            const planLabel = user.plan === "pro" ? "Pro" : "Free";

            statusEl.classList.remove("d-none");
            statusEl.innerHTML = `
                Autentificat ca <strong>${user.full_name || user.email}</strong> —
                <span class="badge-current-plan"><i class="fas fa-circle-info"></i> Plan: ${planLabel}</span>
            `;
        });
    </script>

    <!-- Checkout Stripe: pornește sesiunea de plată la click, redirecționează spre Stripe -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const btn = document.getElementById("btnStartCheckout");
            const btnIcon = document.getElementById("btnStartCheckoutIcon");
            const btnText = document.getElementById("btnStartCheckoutText");
            const errorEl = document.getElementById("checkoutError");
            if (!btn) return;

            btn.addEventListener("click", async () => {
                errorEl.classList.add("d-none");
                errorEl.textContent = "";

                btn.disabled = true;
                btnIcon.classList.remove("fa-credit-card");
                btnIcon.classList.add("fa-spinner", "fa-spin");
                btnText.textContent = "Se pregătește plata...";

                try {
                    const response = await API.post(
                        "/stripe/create-checkout-session",
                        {},
                    );

                    if (!response || !response.url) {
                        throw new Error(
                            "Răspuns invalid de la server (lipsește URL-ul de plată).",
                        );
                    }

                    window.location.href = response.url;
                } catch (err) {
                    console.error("Eroare la inițierea plății Stripe:", err);
                    errorEl.textContent =
                        (err && err.message) ||
                        "Nu s-a putut iniția plata. Încearcă din nou sau contactează suportul.";
                    errorEl.classList.remove("d-none");

                    btn.disabled = false;
                    btnIcon.classList.remove("fa-spinner", "fa-spin");
                    btnIcon.classList.add("fa-credit-card");
                    btnText.textContent = "Continuă la plată";
                }
            });
        });
    </script>
</body>

</html>
