<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectricalVPF ERP | Invoices</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Dashboard & Shell CSS -->
    <link href="css/dashboard.css" rel="stylesheet">
</head>

<body data-page-title="Invoices Management">

    <div class="erp-wrapper">

        <!-- Dynamic Sidebar Container -->
        <div id="shellSidebar"></div>

        <!-- MAIN CONTENT AREA -->
        <main class="erp-main">

            <!-- Dynamic Topbar Container -->
            <div id="shellTopbar"></div>

            <!-- INVOICES BODY CONTENT -->
            <div class="content-body">

                <!-- CONTROLS HEADER (Search & Status Filter) -->
                <div class="card content-card mb-4">
                    <div class="card-body p-3">
                        <div class="row g-3 align-items-center justify-content-between">
                            <!-- Search Bar & Status Filter -->
                            <div class="col-12 col-md-8">
                                <div class="row g-2">
                                    <div class="col-12 col-md-7">
                                        <div class="input-group">
                                            <span class="input-group-text bg-white border-end-0 text-muted">
                                                <i class="fas fa-search"></i>
                                            </span>
                                            <input type="text" id="searchInput" class="form-control border-start-0 ps-0"
                                                placeholder="Căutare după număr factură, client sau proiect...">
                                        </div>
                                    </div>
                                    <div class="col-12 col-md-5">
                                        <select id="statusFilter" class="form-select">
                                            <option value="">Toate Statusurile</option>
                                            <option value="draft">Ciornă (Draft)</option>
                                            <option value="sent">Trimisă (Sent)</option>
                                            <option value="paid">Plătită (Paid)</option>
                                            <option value="partial">Plătită Parțial (Partial)</option>
                                            <option value="overdue">Restantă (Overdue)</option>
                                            <option value="canceled">Anulată (Canceled)</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="col-12 col-md-auto text-md-end">
                                <button type="button" id="btnDeleteAllInvoices"
                                    class="btn btn-danger d-inline-flex align-items-center gap-2">
                                    <i class="fas fa-trash-alt"></i> Șterge Tot
                                </button>
                            </div>

                        </div>
                    </div>
                </div>

                <!-- INVOICES TABLE CARD -->
                <div class="card content-card">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th class="ps-4">Număr Factură</th>
                                        <th>Client & Proiect</th>
                                        <th>Data Emiterii</th>
                                        <th>Scadență</th>
                                        <th>Total Net</th>
                                        <th>Total Brut</th>
                                        <th>Status</th>
                                        <th class="text-end pe-4">Acțiuni</th>
                                    </tr>
                                </thead>
                                <tbody id="invoicesTableBody">
                                    <tr>
                                        <td colspan="8" class="text-center py-4 text-muted">Se încarcă facturile...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <!-- PAGINATION FOOTER -->
                    <div class="card-footer bg-white border-top-0 py-3 d-flex align-items-center justify-content-between"
                        id="paginationContainer"></div>
                </div>

            </div>

        </main>

    </div>

    <!-- MODAL VIZUALIZARE / PREVIEW FACTURĂ -->
    <div class="modal fade" id="viewInvoiceModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="viewModalTitle">Detalii Factură</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="viewModalBody">
                    <!-- Populated dynamically by JS -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Închide</button>
                </div>
            </div>
        </div>
    </div>

    <!-- TOAST CONTAINER FOR NOTIFICATIONS -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="erpToast" class="toast align-items-center text-white bg-success border-0" role="alert"
            aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="toastMessage">
                    Opțiune salvată cu succes!
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Global ERP Utilities & Config -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/api.js"></script>
    <script src="js/shell.js"></script>

    <!-- Module Specific JS -->
    <script src="js/invoices.js"></script>

</body>

</html>
