<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectricalVPF ERP | Login</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="../css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Login CSS -->
    <link href="css/login.css" rel="stylesheet">
</head>

<body>

    <div class="login-page">
        <div class="background-overlay"></div>

        <div class="container">
            <div class="row justify-content-center align-items-center min-vh-100">
                <div class="col-12 d-flex justify-content-center">

                    <div class="login-card">

                        <!-- Logo & Header -->
                        <div class="text-center mb-4">
                            <div class="logo-circle">
                                <i class="fas fa-bolt"></i>
                            </div>
                            <h1 class="brand-title">ElectricalVPF ERP</h1>
                            <p class="brand-subtitle">Electrical Estimating • CRM • Projects • Invoicing</p>
                        </div>

                        <!-- Formular Login -->
                        <form id="loginForm" novalidate>

                            <!-- Div pentru mesaje de eroare de la server -->
                            <div id="loginAlert"></div>

                            <!-- Email Input -->
                            <div class="mb-4">
                                <label for="email" class="form-label">Email Address</label>
                                <div class="input-group has-validation">
                                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                    <input type="email" class="form-control" id="email"
                                        placeholder="office@electricalvpf.com" autocomplete="email">
                                    <div class="invalid-feedback" id="emailFeedback">
                                        Introduceți o adresă de email validă.
                                    </div>
                                </div>
                            </div>

                            <!-- Password Input -->
                            <div class="mb-4">
                                <label for="password" class="form-label">Password</label>
                                <div class="input-group has-validation">
                                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                    <input type="password" class="form-control" id="password"
                                        placeholder="Enter your password" autocomplete="current-password">
                                    <button class="btn btn-outline-secondary toggle-btn" type="button"
                                        id="togglePassword">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                    <div class="invalid-feedback" id="passwordFeedback">
                                        Parola trebuie să aibă cel puțin 6 caractere.
                                    </div>
                                </div>
                            </div>

                            <!-- Opțiuni -->
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="rememberMe">
                                    <label class="form-check-label" for="rememberMe">Remember me</label>
                                </div>
                                <a href="#" class="forgot-password">Forgot password?</a>
                            </div>

                            <!-- Submit Button -->
                            <div class="d-grid">
                                <button type="submit" id="loginButton" class="btn btn-login">
                                    <span id="loginButtonText">
                                        <i class="fas fa-right-to-bracket me-2"></i>Sign In
                                    </span>
                                    <span id="loginSpinner" class="spinner-border spinner-border-sm d-none"
                                        role="status"></span>
                                </button>
                            </div>

                        </form>

                        <!-- Footer -->
                        <div class="login-footer">
                            <p class="mb-1">© 2026 ElectricalVPF ERP</p>
                            <small>Powered by ElectricalVPF</small>
                        </div>

                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap & Login JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js"></script>

</body>

</html>
