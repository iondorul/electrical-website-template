<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectricalVPF ERP | Recuperare Parolă</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="../css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Login CSS (design identic cu login.html) -->
    <link href="css/login.css" rel="stylesheet">
</head>

<body>

    <div class="login-page">
        <div class="background-overlay"></div>

        <div class="container">
            <div class="row justify-content-center align-items-center min-vh-100">
                <div class="col-12 d-flex justify-content-center">

                    <div class="login-card">

                        <!-- Logo & Header -->
                        <div class="text-center mb-4">
                            <div class="logo-circle">
                                <i class="fas fa-bolt"></i>
                            </div>
                            <h1 class="brand-title">ElectricalVPF ERP</h1>
                            <p class="brand-subtitle">Recuperare parolă cont</p>
                        </div>

                        <!-- Formular Forgot Password -->
                        <form id="forgotPasswordForm" novalidate>

                            <!-- Div pentru mesaje de eroare/succes de la server -->
                            <div id="forgotPasswordAlert"></div>

                            <p class="text-muted small mb-4">
                                Introdu adresa de email asociată contului tău. Dacă adresa există în
                                sistem, vei primi un link pentru resetarea parolei (valabil 1 oră).
                            </p>

                            <!-- Email Input -->
                            <div class="mb-4">
                                <label for="fpEmail" class="form-label">Email Address</label>
                                <div class="input-group has-validation">
                                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                    <input type="email" class="form-control" id="fpEmail"
                                        placeholder="office@electricalvpf.com" autocomplete="email">
                                    <div class="invalid-feedback" id="fpEmailFeedback">
                                        Introduceți o adresă de email validă.
                                    </div>
                                </div>
                            </div>

                            <!-- Submit Button -->
                            <div class="d-grid mb-3">
                                <button type="submit" id="fpButton" class="btn btn-login">
                                    <span id="fpButtonText">
                                        <i class="fas fa-paper-plane me-2"></i>Trimite link de resetare
                                    </span>
                                    <span id="fpSpinner" class="spinner-border spinner-border-sm d-none"
                                        role="status"></span>
                                </button>
                            </div>

                            <div class="text-center">
                                <a href="login.html" class="forgot-password">
                                    <i class="fas fa-arrow-left me-1"></i>Înapoi la autentificare
                                </a>
                            </div>

                        </form>

                        <!-- Footer -->
                        <div class="login-footer">
                            <p class="mb-1">© 2026 ElectricalVPF ERP</p>
                            <small>Powered by ElectricalVPF</small>
                        </div>

                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap & Forgot Password JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/forgot-password.js"></script>

</body>

</html>
