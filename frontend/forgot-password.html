<!DOCTYPE html>
<html lang="ro">

<head>
    <script src="js/theme.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectricalVPF ERP | Recuperare Parolă</title>

    <link rel="icon" type="image/svg+xml" href="../img/favicon-light.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Login CSS (design identic cu login.html) -->
    <link href="css/login.css" rel="stylesheet">
</head>

<body>

    <div class="login-page">
        <div class="background-overlay"></div>

        <!-- Comutare temă + selector de limbă (pagină publică, fără sidebar/topbar ERP) -->
        <div class="auth-header-controls">
            <button type="button" class="auth-theme-toggle-btn" id="themeToggleBtn" data-i18n-title="header.toggleTheme"
                data-i18n-aria-label="header.toggleTheme" title="Comută tema" aria-label="Comută tema">
                <i class="fas fa-sun theme-toggle-icon icon-sun"></i>
                <i class="fas fa-moon theme-toggle-icon icon-moon"></i>
            </button>
            <div class="dropdown auth-lang-switcher">
                <button type="button" class="lang-switcher-btn" id="langSwitcherBtn" data-bs-toggle="dropdown"
                    aria-expanded="false" data-i18n-title="header.language" title="Limbă / Language"></button>
                <ul class="dropdown-menu lang-switcher-menu" id="langSwitcherMenu" aria-labelledby="langSwitcherBtn">
                </ul>
            </div>
        </div>

        <div class="container">
            <div class="row justify-content-center align-items-center min-vh-100">
                <div class="col-12 d-flex justify-content-center">

                    <div class="login-card">

                        <!-- Logo & Header -->
                        <div class="text-center mb-4">
                            <div class="logo-circle">
                                <i class="fas fa-bolt"></i>
                            </div>
                            <h1 class="brand-title">ElectricalVPF ERP</h1>
                            <p class="brand-subtitle" data-i18n="auth.forgotPassword.subtitle">Recuperare parolă cont
                            </p>
                        </div>

                        <!-- Formular Forgot Password -->
                        <form id="forgotPasswordForm" novalidate>

                            <!-- Div pentru mesaje de eroare/succes de la server -->
                            <div id="forgotPasswordAlert"></div>

                            <p class="text-muted small mb-4" data-i18n="auth.forgotPassword.description">
                                Introdu adresa de email asociată contului tău. Dacă adresa există în
                                sistem, vei primi un link pentru resetarea parolei (valabil 1 oră).
                            </p>

                            <!-- Email Input -->
                            <div class="mb-4">
                                <label for="fpEmail" class="form-label" data-i18n="auth.common.emailLabel">Email
                                    Address</label>
                                <div class="input-group has-validation">
                                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                    <input type="email" class="form-control" id="fpEmail"
                                        placeholder="office@electricalvpf.com" autocomplete="email">
                                    <div class="invalid-feedback" id="fpEmailFeedback"
                                        data-i18n="auth.common.emailInvalid">
                                        Please enter a valid email address!
                                    </div>
                                </div>
                            </div>

                            <!-- Submit Button -->
                            <div class="d-grid mb-3">
                                <button type="submit" id="fpButton" class="btn btn-login">
                                    <span id="fpButtonText">
                                        <i class="fas fa-paper-plane me-2"></i><span
                                            data-i18n="auth.forgotPassword.submit">Send reset link</span>
                                    </span>
                                    <span id="fpSpinner" class="spinner-border spinner-border-sm d-none"
                                        role="status"></span>
                                </button>
                            </div>

                            <div class="text-center">
                                <a href="login.html" class="forgot-password">
                                    <i class="fas fa-arrow-left me-1"></i><span data-i18n="auth.common.backToLogin">Back
                                        to sign in</span>
                                </a>
                            </div>

                        </form>

                        <!-- Footer -->
                        <div class="login-footer">
                            <p class="mb-1" data-i18n="auth.common.footerCopyright">© 2026 ElectricalVPF ERP</p>
                            <small data-i18n="auth.common.footerPoweredBy">Powered by ElectricalVPF</small>
                        </div>

                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap, i18n & Forgot Password JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/forgot-password.js"></script>

</body>

</html>
