<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectricalVPF ERP | Setări</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Dashboard & Shell CSS -->
    <link href="css/dashboard.css" rel="stylesheet">

    <!-- Settings Modal CSS (scoped to this page only) -->
    <link href="css/settings.css" rel="stylesheet">
</head>

<body data-page-title="Setări" data-page-title-key="settings.pageTitle">

    <div class="erp-wrapper">

        <!-- Dynamic Sidebar Container -->
        <div id="shellSidebar"></div>

        <!-- MAIN CONTENT AREA -->
        <main class="erp-main">

            <!-- Dynamic Topbar Container -->
            <div id="shellTopbar"></div>

            <!-- SETTINGS BODY CONTENT (background behind modal) -->
            <div class="content-body"></div>

        </main>

    </div>

    <!-- SETTINGS MODAL (Claude.ai / Stripe style: fixed sidebar + dynamic content) -->
    <div class="modal fade" id="settingsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered settings-modal-dialog">
            <div class="modal-content settings-modal-content">
                <div class="modal-header settings-modal-header">
                    <h5 class="modal-title fw-bold mb-0">
                        <i class="fas fa-gear me-2 text-muted"></i><span data-i18n="settings.pageTitle">Setări</span>
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="settings-body">
                    <nav class="settings-sidebar" id="settingsNav">
                        <!-- Populat dinamic de settings.js din tab-urile înregistrate -->
                    </nav>
                    <div class="settings-content" id="settingsContent">
                        <!-- Populat dinamic de tab-ul activ -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- TOAST CONTAINER FOR NOTIFICATIONS -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="erpToast" class="toast align-items-center text-white bg-success border-0" role="alert"
            aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="toastMessage">
                    Opțiune salvată cu succes!
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Global ERP Utilities & Config -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/api.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/shell.js"></script>

    <!-- Settings Tabs (each is a self-contained, independently extensible module) -->
    <script src="js/settings/companyTab.js"></script>
    <script src="js/settings/accountTab.js"></script>
    <script src="js/settings/billingTab.js"></script>
    <script src="js/settings/privacyTab.js"></script>

    <!-- Settings Controller (mounts tabs, handles switching + modal lifecycle) -->
    <script src="js/settings.js"></script>

</body>

</html>
