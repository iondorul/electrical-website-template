<header class="erp-header">
    <div class="d-flex align-items-center">
        <!-- Am scos butonul redundant sidebarToggle de aici -->
        <h4 class="page-title mb-0" id="shellPageTitle">--</h4>
    </div>

    <div class="header-user d-flex align-items-center">
        <!-- Comutare rapidă Light/Dark — shortcut cu 2 stări (nu deschide
             meniul cu 3 opțiuni ca tab-ul Display din Setări). Iconițele sunt
             randate 100% prin CSS (vezi .theme-toggle-icon în dashboard.css/
             dark-theme.css), afișate/ascunse pe baza atributului [data-theme]
             de pe <html>, același atribut pe care Display tab îl setează, deci
             sincronizarea e automată/instantă, fără cod JS suplimentar de
             sincronizare (vezi initThemeToggle() în theme.js pentru click). -->
        <button type="button" class="header-logout-btn theme-toggle-btn me-2" id="themeToggleBtn"
            data-i18n-title="header.toggleTheme" data-i18n-aria-label="header.toggleTheme" title="Comută tema" aria-label="Comută tema">
            <i class="fas fa-sun theme-toggle-icon icon-sun"></i>
            <i class="fas fa-moon theme-toggle-icon icon-moon"></i>
        </button>
        <div class="dropdown lang-switcher me-2">
            <button type="button" class="header-logout-btn lang-switcher-btn" id="langSwitcherBtn"
                data-bs-toggle="dropdown" aria-expanded="false" data-i18n-title="header.language" title="Limbă / Language"></button>
            <ul class="dropdown-menu lang-switcher-menu" id="langSwitcherMenu" aria-labelledby="langSwitcherBtn"></ul>
        </div>
        <a href="settings.html" class="header-logout-btn header-settings-btn me-2" id="headerSettingsBtn"
            data-i18n-title="header.settings" data-i18n-aria-label="header.settings" title="Setări" aria-label="Setări" style="text-decoration: none;">
            <i class="fas fa-gear"></i>
            <span data-i18n="header.settings">Setări</span>
        </a>
        <button type="button" class="header-logout-btn me-3" id="headerLogoutBtn"
            data-i18n-title="header.logout" data-i18n-aria-label="header.logout" title="Logout" aria-label="Logout">
            <i class="fas fa-sign-out-alt"></i>
            <span data-i18n="header.logout">Logout</span>
        </button>
        <div class="user-info text-end me-3">
            <span class="user-name d-block fw-bold" id="shellUserName">--</span>
            <small class="user-role text-muted" id="shellUserRole">--</small>
        </div>
        <button type="button" class="user-avatar" id="headerAvatarBtn" data-bs-toggle="modal"
            data-bs-target="#avatarPickerModal" data-i18n-title="header.changeAvatar" data-i18n-aria-label="header.changeAvatar"
            title="Schimbă avatarul" aria-label="Schimbă avatarul">
            <i class="fas fa-user-shield"></i>
        </button>
    </div>
</header>

<!-- Galerie de avatare tematice (electrician) — deschisă din iconița de mai
     sus, disponibilă pe orice pagină ERP (topbar.html e inclus peste tot). -->
<div class="modal fade" id="avatarPickerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" data-i18n="header.chooseAvatar">Alege avatarul</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="avatar-gallery-grid" id="avatarGalleryGrid"></div>
                <div class="alert alert-danger d-none small mt-3 mb-0" id="avatarPickerError" role="alert"></div>
            </div>
        </div>
    </div>
</div>
