<header class="erp-header">
    <div class="d-flex align-items-center">
        <!-- Am scos butonul redundant sidebarToggle de aici -->
        <h4 class="page-title mb-0" id="shellPageTitle">--</h4>
    </div>

    <div class="header-user d-flex align-items-center">
        <a href="settings.html" class="header-logout-btn header-settings-btn me-2" id="headerSettingsBtn"
            title="Setări" aria-label="Setări" style="text-decoration: none;">
            <i class="fas fa-gear"></i>
            <span>Setări</span>
        </a>
        <button type="button" class="header-logout-btn me-3" id="headerLogoutBtn" title="Logout" aria-label="Logout">
            <i class="fas fa-sign-out-alt"></i>
            <span>Logout</span>
        </button>
        <div class="user-info text-end me-3">
            <span class="user-name d-block fw-bold" id="shellUserName">--</span>
            <small class="user-role text-muted" id="shellUserRole">--</small>
        </div>
        <button type="button" class="user-avatar" id="headerAvatarBtn" data-bs-toggle="modal"
            data-bs-target="#avatarPickerModal" title="Schimbă avatarul" aria-label="Schimbă avatarul">
            <i class="fas fa-user-shield"></i>
        </button>
    </div>
</header>

<!-- Galerie de avatare tematice (electrician) — deschisă din iconița de mai
     sus, disponibilă pe orice pagină ERP (topbar.html e inclus peste tot). -->
<div class="modal fade" id="avatarPickerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Alege avatarul</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="avatar-gallery-grid" id="avatarGalleryGrid"></div>
                <div class="alert alert-danger d-none small mt-3 mb-0" id="avatarPickerError" role="alert"></div>
            </div>
        </div>
    </div>
</div>
