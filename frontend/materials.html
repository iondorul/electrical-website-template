<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectricalVPF ERP | Materials</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link href="css/dashboard.css" rel="stylesheet">
</head>

<body data-page-title="Materials Management" data-page-title-key="materials.pageTitle">

    <div class="erp-wrapper">

        <div id="shellSidebar"></div>

        <main class="erp-main">

            <div id="shellTopbar"></div>

            <div class="content-body">

                <!-- CONTROLS HEADER -->
                <div class="card content-card mb-4">
                    <div class="card-body p-3">
                        <div class="row g-3 align-items-center justify-content-between">
                            <div class="col-12 col-md-8">
                                <div class="row g-2">
                                    <div class="col-12 col-md-7">
                                        <div class="input-group">
                                            <span class="input-group-text bg-white border-end-0 text-muted">
                                                <i class="fas fa-search"></i>
                                            </span>
                                            <input type="text" id="searchInput" class="form-control border-start-0 ps-0"
                                                data-i18n-placeholder="materials.searchPlaceholder" placeholder="Căutare după cod sau denumire...">
                                        </div>
                                    </div>
                                    <div class="col-12 col-md-5">
                                        <select id="categoryFilter" class="form-select">
                                            <option value="" data-i18n="materials.allCategories">Toate Categoriile</option>
                                            <option value="Cabluri" data-i18n="materials.category.cabluri">Cabluri</option>
                                            <option value="Tablouri" data-i18n="materials.category.tablouri">Tablouri</option>
                                            <option value="Aparataj" data-i18n="materials.category.aparataj">Aparataj</option>
                                            <option value="Siguranțe" data-i18n="materials.category.siguranțe">Siguranțe</option>
                                            <option value="Iluminat" data-i18n="materials.category.iluminat">Iluminat</option>
                                            <option value="Altele" data-i18n="materials.category.altele">Altele</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="col-12 col-md-auto text-md-end d-flex gap-2 justify-content-md-end">
                                <button type="button" id="btnAddMaterial"
                                    class="btn btn-primary d-inline-flex align-items-center gap-2">
                                    <i class="fas fa-plus"></i> <span data-i18n="materials.addMaterial">Adaugă Material</span>
                                </button>
                                <button type="button" id="btnDeleteAllMaterials"
                                    class="btn btn-danger d-inline-flex align-items-center gap-2">
                                    <i class="fas fa-trash-alt"></i> <span data-i18n="quotes.deleteAll">Șterge Tot</span>
                                </button>
                            </div>

                        </div>
                    </div>
                </div>

                <!-- MATERIALS TABLE CARD -->
                <div class="card content-card">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th class="ps-4" data-i18n="materials.table.code">Cod</th>
                                        <th data-i18n="materials.table.name">Denumire</th>
                                        <th data-i18n="materials.table.category">Categorie</th>
                                        <th data-i18n="estimating.itemTable.unit">UM</th>
                                        <th data-i18n="materials.table.unitPrice">Preț Unitar</th>
                                        <th data-i18n="materials.table.stock">Stoc</th>
                                        <th class="text-end pe-4" data-i18n="common.actions">Acțiuni</th>
                                    </tr>
                                </thead>
                                <tbody id="materialsTableBody">
                                    <tr>
                                        <td colspan="7" class="text-center py-4 text-muted" data-i18n="materials.loadingList">Se încarcă materialele...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div class="card-footer bg-white border-top-0 py-3 d-flex align-items-center justify-content-between"
                        id="paginationContainer"></div>
                </div>

            </div>

        </main>

    </div>

    <!-- MODAL ADĂUGARE / EDITARE MATERIAL -->
    <div class="modal fade" id="materialModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="materialModalTitle" data-i18n="materials.addMaterial">Adaugă Material</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="materialId">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label" data-i18n="materials.itemCode">Cod Articol (SKU)</label>
                            <input type="text" id="materialItemCode" class="form-control" placeholder="ex: CBL-3X2.5">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" data-i18n="materials.categoryRequired">Categorie *</label>
                            <select id="materialCategory" class="form-select">
                                <option value="Cabluri" data-i18n="materials.category.cabluri">Cabluri</option>
                                <option value="Tablouri" data-i18n="materials.category.tablouri">Tablouri</option>
                                <option value="Aparataj" data-i18n="materials.category.aparataj">Aparataj</option>
                                <option value="Siguranțe" data-i18n="materials.category.siguranțe">Siguranțe</option>
                                <option value="Iluminat" data-i18n="materials.category.iluminat">Iluminat</option>
                                <option value="Altele" data-i18n="materials.category.altele">Altele</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label" data-i18n="materials.nameRequired">Denumire *</label>
                            <input type="text" id="materialName" class="form-control"
                                data-i18n-placeholder="materials.namePlaceholder" placeholder="ex: Cablu CYABY 3x2.5mm">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" data-i18n="materials.unitRequired">Unitate de Măsură *</label>
                            <select id="materialUnit" class="form-select">
                                <option value="buc">buc (bucată)</option>
                                <option value="m">m (metru)</option>
                                <option value="ml">ml (metru liniar)</option>
                                <option value="rolă">rolă</option>
                                <option value="set">set</option>
                                <option value="pereche">pereche</option>
                                <option value="cutie">cutie</option>
                                <option value="pachet">pachet</option>
                                <option value="kg">kg</option>
                                <option value="l">l (litru)</option>
                                <option value="mp">mp (metru pătrat)</option>
                                <option value="h">h (oră manoperă)</option>
                                <option value="__custom__" data-i18n="materials.otherUnit">Altă unitate...</option>
                            </select>
                            <input type="text" id="materialUnitCustom" class="form-control mt-2 d-none"
                                data-i18n-placeholder="materials.customUnitPlaceholder" placeholder="Introdu unitatea personalizată">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" data-i18n="materials.unitPriceEur">Preț Unitar (EUR)</label>
                            <input type="number" id="materialPrice" class="form-control" step="0.01" min="0">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" data-i18n="materials.availableStock">Stoc Disponibil</label>
                            <input type="number" id="materialStock" class="form-control" step="0.001" min="0">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" data-i18n="materials.lowStockThreshold">Prag Stoc Redus</label>
                            <input type="number" id="materialMinStock" class="form-control" step="0.001" min="0"
                                placeholder="ex. 10">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal" data-i18n="common.cancel">Anulează</button>
                    <button type="button" class="btn btn-primary" id="btnSaveMaterial">
                        <i class="fas fa-save me-1"></i> <span data-i18n="common.save">Salvează</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- TOAST CONTAINER -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="erpToast" class="toast align-items-center text-white bg-success border-0" role="alert"
            aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="toastMessage">Opțiune salvată cu succes!</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Close"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/api.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/shell.js"></script>

    <script src="js/materials.js"></script>

</body>

</html>
